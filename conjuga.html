<meta charset="utf-8">
<title>Conjuga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F6F4EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-hyperlegible-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts: self-hosted latin subsets (from Google Fonts) so the app works offline. Bricolage is one variable file (opsz 12-96, wght 500-800). */
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:500 800;font-display:swap;src:url(fonts/bricolage-grotesque-latin.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-400-latin.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-700-latin.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-400italic-latin.woff2) format("woff2")}
/* Layout: single phone-width column, app bar on top, tab bar fixed at bottom, quiz and verb pages as full-screen sheets */
/* Themes: tokens sit on [data-theme] (not just :root) so the Settings swatches can preview any theme in place. An explicit data-theme always beats the system dark query. */
:root{
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --r:20px;
}
:root,[data-theme="light"]{
  --bg:#F6F4EF; --surface:#FFFFFF; --sunk:#ECE9E2; --ink:#16181D; --muted:#5B5F68; --soft:#3F434B; --line:#E2DED6; --edge:#8F8A80; --track:#DAD6CD;
  --blue:#2350C8; --blue-ink:#FFFFFF; --blue-soft:#D6DEF7; --blue-hover:#1A3C99; --gold:#BF820F; --ok:#1E7A4F; --ok-soft:#E4F2EA; --bad:#C2362B; --bad-soft:#FAE8E5; --irr:#975700; --irr-soft:#FAEBD6; --stage:#E5E1D8; --scrim:rgba(10,15,30,.5); color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#121316; --surface:#1C1E23; --sunk:#24272D; --ink:#EDEBE6; --muted:#A3A7B0; --soft:#C4C7CE; --line:#2C2F36; --edge:#6B707A; --track:#363A42;
  --blue:#8AA8FF; --blue-ink:#0E1630; --blue-soft:#26345E; --blue-hover:#A9C0FF; --gold:#F2B544; --ok:#4FD08F; --ok-soft:#163324; --bad:#FF7A6E; --bad-soft:#3A1C1A; --irr:#F2B544; --irr-soft:#3A2C12; --stage:#0B0C0E; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
[data-theme="dark"]{
  --bg:#121316; --surface:#1C1E23; --sunk:#24272D; --ink:#EDEBE6; --muted:#A3A7B0; --soft:#C4C7CE; --line:#2C2F36; --edge:#6B707A; --track:#363A42;
  --blue:#8AA8FF; --blue-ink:#0E1630; --blue-soft:#26345E; --blue-hover:#A9C0FF; --gold:#F2B544; --ok:#4FD08F; --ok-soft:#163324; --bad:#FF7A6E; --bad-soft:#3A1C1A; --irr:#F2B544; --irr-soft:#3A2C12; --stage:#0B0C0E; --scrim:rgba(0,0,0,.6); color-scheme:dark}
/* Sunset: peach paper, magenta accent */
[data-theme="sunset"]{
  --bg:#FCE1CF; --surface:#FFF5EE; --sunk:#F8D0BA; --ink:#2A1418; --muted:#6E4148; --soft:#4F2A31; --line:#F0C6AE; --edge:#A06A5E; --track:#F2C0A5;
  --blue:#A3195B; --blue-ink:#FFFFFF; --blue-soft:#F7CCDD; --blue-hover:#7E1146; --gold:#B86A00; --ok:#17683F; --ok-soft:#DCEFDD; --bad:#B02A1E; --bad-soft:#F9D6CE; --irr:#8E4A00; --irr-soft:#FBDDB6; --stage:#F4CDB6; --scrim:rgba(60,15,30,.5); color-scheme:light}
/* Ocean: deep sea blue, teal accent, coral-orange irregulars */
[data-theme="ocean"]{
  --bg:#0D3048; --surface:#123D5A; --sunk:#143F5B; --ink:#E9F6FA; --muted:#A7C6D3; --soft:#CBE0E8; --line:#215676; --edge:#5A8EAA; --track:#22597A;
  --blue:#36B8AB; --blue-ink:#032824; --blue-soft:#0C3A44; --blue-hover:#9AF0E6; --gold:#FFD166; --ok:#7CF0AE; --ok-soft:#124A3A; --bad:#FF9C8C; --bad-soft:#4A2630; --irr:#FFB877; --irr-soft:#4A3624; --stage:#082234; --scrim:rgba(0,10,20,.65); color-scheme:dark}
/* Contrast: black and white with a yellow accent and cyan irregulars */
[data-theme="contrast"]{
  --bg:#000000; --surface:#0D0D0D; --sunk:#1A1A1A; --ink:#FFFFFF; --muted:#D0D0D0; --soft:#E6E6E6; --line:#5A5A5A; --edge:#B0B0B0; --track:#3A3A3A;
  --blue:#FFD60A; --blue-ink:#000000; --blue-soft:#3A3000; --blue-hover:#FFE45C; --gold:#FFD60A; --ok:#5CF08A; --ok-soft:#06301A; --bad:#FF7070; --bad-soft:#3C0B0B; --irr:#5CD8FF; --irr-soft:#062F3D; --stage:#000000; --scrim:rgba(0,0,0,.75); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;flex:1}
.brand span{color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--blue-soft);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill.gold{background:color-mix(in srgb,var(--gold) 22%,transparent)}
main{padding-block:16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sunk);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:12px 0 14px;font-size:12px;font-weight:700;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs svg{width:56px;height:32px;padding:5px 17px;box-sizing:border-box;border-radius:16px}
.tabs button[aria-selected="true"] svg{background:var(--blue-soft)}
.muted{color:var(--muted)}
.small{font-size:14px}
.tense{margin-top:22px}
.tense{background:var(--surface);border-radius:24px;padding:16px}
.tense-head{display:flex;align-items:baseline;gap:12px}
.tense-head h2{font-size:21px;flex:1}
.tense-head .ex{font-size:13px;color:var(--muted);font-style:italic}
.tense-sub{font-size:14px;color:var(--muted);margin:4px 0 0}
.deep{font-size:14px;margin-top:6px}
.deep summary{cursor:pointer;color:var(--blue);font-weight:600;width:max-content}
.deep h4{margin:12px 0 2px;font-size:14px}
.deep p{margin:0;color:var(--ink);line-height:1.5}
.tip summary{list-style:none;cursor:pointer}
.tip summary::-webkit-details-marker{display:none}
.tip summary h2{font-size:20px}
.tip td:first-child{width:auto}
.tiplink{display:block;background:none;border:0;padding:6px 0 0;color:var(--blue);font-weight:600;font-size:14px;text-align:left;cursor:pointer}
.tip table{font-size:14px;margin-top:4px}
.tip[open] summary{margin-bottom:4px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.lvl{background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.lvl:not(:disabled):hover{border-color:var(--blue)}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl .n{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lvl .g{font-weight:700}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.stars .off{color:var(--edge)}
.card{background:var(--surface);border:0;border-radius:24px;padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--edge);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--ink)}
.btn{border:0;border-radius:26px;min-height:52px;padding:12px 22px;font-weight:700;font-size:16px;background:var(--blue);color:var(--blue-ink);width:100%}
.btn:not(.ghost):not(:disabled):hover{background:var(--blue-hover)}
.btn.ghost{background:transparent;border:1.5px solid var(--muted);color:var(--ink)}
.row>.btn{flex:1;width:auto;min-width:0}
.btn.sm{width:auto;min-height:40px;padding:8px 16px;font-size:14px;border-radius:20px}
.btn:disabled{opacity:.5}
input[type=search],.answer{width:100%;box-sizing:border-box;border:2px solid var(--edge);border-radius:16px;padding:12px 14px;font:inherit;background:var(--surface);color:var(--ink)}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.tag.irr{background:var(--irr-soft);color:var(--irr)}
.tag.gold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.switch input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.switch select{max-width:55%;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--edge);background:var(--surface);color:inherit}
.big{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis .card{padding:12px;text-align:center}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.grid2 h3{font-size:16px;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:15px}
td{padding:5px 6px;border-bottom:1px solid var(--line)}
td:first-child{color:var(--muted);width:44%}
mark{background:none;color:var(--irr);font-weight:700;text-decoration:underline dotted 2px;text-underline-offset:4px}
/* dictionary list */
.dict-tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--edge);border-radius:99px;overflow:hidden;flex:1}
.seg button{flex:1;border:0;background:var(--surface);padding:7px 10px;font-size:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--ink)}
.iconbtn{border:1.5px solid var(--edge);background:var(--surface);border-radius:99px;min-width:40px;height:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700}
.iconbtn svg{width:18px;height:18px}
.iconbtn.on{border-color:var(--blue);color:var(--blue)}
.dict{display:grid;grid-template-columns:minmax(0,1fr) 26px;gap:4px}
.letter{font-family:var(--display);font-weight:800;color:var(--muted);padding:14px 4px 4px;scroll-margin-top:70px}
.vrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.vrow .star{background:none;border:0;font-size:20px;color:var(--edge);padding:10px 4px}
.vrow .star[aria-pressed="true"]{color:var(--gold)}
.vrow .open{background:none;border:0;text-align:left;padding:12px 0;display:flex;gap:8px;align-items:center;min-width:0}
.vrow .open b{font-family:var(--display);font-size:18px;flex:none}
.vrow .open span.m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:flex;flex-direction:column;align-items:center}
.rail button{background:none;border:0;font-size:11px;font-weight:700;color:var(--blue);padding:1px 4px;line-height:1.35}
.section-label{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:12px 4px 4px}
/* verb page */
.vhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.vhead .t{flex:1;min-width:0}
.mood{margin-top:8px}
.mood h2{font-size:22px}
.tcard{background:var(--surface);border:0;border-radius:20px;overflow:hidden}
.tcard header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.tcard header h3{flex:1;font-size:17px}
.tcard header button{background:var(--surface);border:1px solid var(--edge);border-radius:99px;height:32px;min-width:32px;padding:0 10px;font-size:14px;font-weight:700}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
.frow .f{font-size:17px}
.frow .f .p{color:var(--muted);margin-right:6px}
.frow .en{grid-column:1;font-style:italic;color:var(--muted);font-size:14px}
.frow .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:2px}
.frow .acts button{background:none;border:0;color:var(--blue);padding:6px;border-radius:8px}
.frow .acts svg{width:20px;height:20px;display:block}
.grpl{font-weight:700;margin:14px 0 8px;color:var(--muted);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.ex-es{font-weight:700}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:14px 24px;display:flex;flex-direction:column;gap:16px;min-height:calc(100% - 38px)}
.modal{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.modal .panel{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:20px 20px 0 0;box-sizing:border-box;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px;color:var(--muted)}
.prog{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.prompt{text-align:center;padding:18px 12px}
.prompt .tchip{display:inline-block;font-size:13px;font-weight:700;color:var(--ink);background:var(--sunk);border-radius:99px;padding:4px 12px}
.prompt .inf{font-family:var(--display);font-size:42px;font-weight:800;letter-spacing:-.02em;margin-top:10px;overflow-wrap:anywhere}
.prompt .en{color:var(--muted)}
.prompt .who{font-family:var(--display);font-size:24px;font-weight:700;margin-top:14px}
.answer{font-family:var(--display);font-size:22px;text-align:center;font-weight:600;border-color:var(--blue)}
.answer.ok{border-color:var(--ok)} .answer.bad{border-color:var(--bad)}
.accents{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.accents button{border:0;background:var(--sunk);border-radius:10px;width:42px;height:42px;font-size:19px;font-weight:700}
.fb{border-radius:var(--r);padding:14px 16px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .c{font-family:var(--display);font-size:22px;color:var(--ink)}
.spacer{flex:1}
.speak{background:none;border:0;color:var(--blue);font-weight:700;padding:4px;vertical-align:middle}
.tally{display:flex;gap:8px;font-variant-numeric:tabular-nums}
.okc{color:var(--ok)} .badc{color:var(--bad)}
.wrongc mark,.wrongc{color:var(--bad)}
.cmp{display:flex;flex-direction:column;gap:4px;margin:8px 0;color:var(--ink);font-weight:400}
.diag{margin:6px 0 0;color:var(--ink);font-weight:400}
.opt{border:2px solid var(--edge);background:var(--surface);border-radius:16px;padding:14px;font-size:19px;font-weight:700;width:100%}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.stepn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:14px;margin-right:6px}
.lbl{font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.mist{padding:12px;display:flex;flex-direction:column;gap:4px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:140px;align-items:end}
.heat{display:grid;gap:4px}
.cell{height:34px;border:0;border-radius:8px;font:700 13px var(--body);padding:0;color:var(--ink);display:grid;place-items:center}
.h4{background:var(--blue);color:var(--blue-ink)}.h3{background:color-mix(in srgb,var(--blue) 50%,var(--surface))}
.h2{background:var(--blue-soft)}.h1{background:var(--irr-soft);box-shadow:inset 0 0 0 1.5px var(--irr)}.h0{background:var(--bg);color:var(--muted)}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bcol i{display:block;width:70%;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
.bnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.blab{font-size:12px;color:var(--muted)}
/* theme swatches in Settings: each preview carries its own data-theme so it shows that theme's tokens */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.themes button{display:flex;flex-direction:column;gap:6px;padding:6px 6px 8px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);font-size:13px;font-weight:700;text-align:center}
.themes button[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.themes button[aria-pressed="true"]>span:last-child::before{content:"✓ ";color:var(--blue)}
.tprev{display:flex;height:46px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.tprev>span{flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:6px;background:var(--bg)}
.tprev i{display:block;height:12px;border-radius:5px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tprev b{display:flex;gap:4px}
.tprev b::before,.tprev b::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue)}
.tprev b::after{background:var(--irr)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.96)}to{transform:none}}
.fb{animation:pop .15s ease-out}
</style>

<header class="bar"><div class="wrap">
  <div class="brand">Conjuga<span>.</span></div>
  <span class="pill gold" title="Day streak">🔥 <b id="streak">0</b></span>
  <span class="pill" title="Experience points"><b id="xp">0</b> XP</span>
  <button class="iconbtn" id="gear" aria-label="Settings"></button>
</div></header>

<main class="wrap" id="view"></main>

 pres:[['When to use it','Routines and habits (<i>trabajo los lunes</i>), facts that are always true (<i>el agua hierve a 100 grados</i>), and what is happening right now (<i>¿qué haces?</i> – what are you doing?). Spanish also uses it for the near future when there is a time word: <i>mañana salgo temprano</i> (I am leaving early tomorrow).'],
  ['Presente vs. estar + -ando / -iendo','English needs "I am eating" for something in progress; Spanish usually just says <i>como</i>. Use <i>estoy comiendo</i> only to stress that it is happening at this very moment: <i>No puedo hablar, estoy comiendo</i> (I can\'t talk, I\'m eating right now).'],
  ['Watch out','"How long have you lived here?" uses the present in Spanish: <i>¿Cuánto tiempo hace que vives aquí?</i> – <i>Vivo aquí desde 2020</i>.']],
 prox:[['When to use it','Plans and intentions, and things that are clearly about to happen: <i>Mira las nubes, va a llover</i> (Look at the clouds, it is going to rain). This is the most common way to talk about the future in everyday speech.'],
  ['Futuro próximo vs. futuro simple','<i>Voy a comer</i> feels like a plan or something already decided. <i>Comeré</i> sounds more distant, formal, or like a promise or prediction. In conversation, <i>ir a</i> is much more common.'],
  ['How it is built','Present of <b>ir</b> (voy, vas, va, vamos, vais, van) + <b>a</b> + infinitive. Only <i>ir</i> changes; the second verb never does.']],
 pret:[['When to use it','Finished actions with a clear start or end in the past: what happened, once, or a set number of times. <i>Ayer fui al cine</i>, <i>Viví en Roma tres años</i>, <i>Llamé dos veces</i>.'],
  ['Pretérito vs. imperfecto','Think of a film. The <b>pretérito</b> moves the story forward: the events, one after another (<i>entré, vi a Ana y la saludé</i>). The <b>imperfecto</b> is the background scenery: what things were like or what was going on (<i>hacía sol, la gente paseaba</i>).'],
  ['Clue words','<i>ayer, anoche, el año pasado, una vez, de repente, en 2010, hace tres días</i> usually point to the pretérito.'],
  ['Meaning shifts','Some verbs change meaning: <i>conocí</i> = I met (for the first time), <i>supe</i> = I found out, <i>quise</i> = I tried, <i>no quise</i> = I refused.']],
 impf:[['When to use it','Three main jobs: (1) <b>past habits</b> – what you used to do (<i>de niño nadaba cada día</i>); (2) <b>description</b> – time, age, weather, feelings, how things looked (<i>eran las diez, tenía frío</i>); (3) <b>actions in progress</b> when something else happened (<i>leía cuando sonó el teléfono</i>).'],
  ['Hablaba vs. estaba hablando','Both can mean "I was speaking". <i>Hablaba</i> is the default and also covers "I used to speak". <i>Estaba hablando</i> (imperfect of estar + -ando) only means "was in the middle of speaking" and zooms in on that moment: <i>Estaba hablando por teléfono cuando entraste</i>. If you mean a habit, you must use <i>hablaba</i>: <i>Siempre hablaba con mi abuela los domingos</i>, never <i>estaba hablando</i>.'],
  ['Imperfecto vs. pretérito','Imperfecto has no clear end: it sets the scene. Pretérito is a completed event. <i>Llovía</i> (it was raining – background) vs. <i>llovió mucho ayer</i> (it rained a lot – a finished event).'],
  ['Clue words','<i>siempre, a menudo, cada día, todos los veranos, de niño, mientras, antes</i> usually point to the imperfecto.']],
 fut:[['When to use it','Predictions, promises and more formal statements about the future: <i>Te llamaré</i> (I will call you), <i>Lloverá mañana</i>.'],
  ['Guessing about now','The future also expresses probability in the present: <i>¿Qué hora será?</i> (I wonder what time it is), <i>Tendrá unos 30 años</i> (He must be about 30).'],
  ['Futuro vs. ir a','For plans already decided, <i>voy a</i> + infinitive is more natural in conversation. The futuro simple sounds more certain, formal or distant.'],
  ['How it is built','Add the endings to the whole infinitive: <i>hablar → hablaré</i>. The same endings work for -ar, -er and -ir. Irregulars change the stem only (<i>tener → tendr-</i>, <i>hacer → har-</i>).']],
 cond:[['When to use it','What would happen in a situation: <i>Con más dinero, viajaría</i>. Polite requests and advice: <i>¿Podrías ayudarme?</i>, <i>Deberías descansar</i>.'],
  ['Guessing about the past','Like the future guesses about now, the conditional guesses about the past: <i>Serían las diez cuando llegó</i> (It must have been about ten when he arrived).'],
  ['With "si" clauses','<i>Si tuviera tiempo, iría</i> – the "if" part uses the imperfect subjunctive, the result uses the conditional. Never put the conditional right after <i>si</i>.'],
  ['How it is built','Same stems as the future (including the irregular ones) + the -ía endings from the imperfect: <i>hablaría, tendría, haría</i>.']],

  ['Perfecto vs. pretérito','<i>Hoy he comido paella</i> (today is not over) vs. <i>Ayer comí paella</i> (yesterday is finished). In Spain this split is quite strict. In most of Latin America the pretérito is used for both: <i>Hoy comí paella</i>.'],
  ['How it is built','Present of <b>haber</b> (he, has, ha, hemos, habéis, han) + past participle (<i>-ado / -ido</i>). The participle never changes, and nothing goes between <i>haber</i> and the participle: <i>Lo he visto</i>, not <i>he lo visto</i>.']],
 plup:[['When to use it','An action that was already done before another past moment: <i>Cuando llegué, la película ya había empezado</i> (the film had already started).'],
  ['How it is built','Imperfect of <b>haber</b> (había, habías, había, habíamos, habíais, habían) + past participle.'],
  ['Clue words','<i>ya</i> (already), <i>nunca antes</i> (never before), <i>todavía no</i> (not yet) often appear with it.']],

  ['Guessing about the recent past','Very common for guesses: <i>Habrá perdido el autobús</i> (He must have missed the bus).'],
  ['How it is built','Future of <b>haber</b> (habré, habrás, habrá…) + past participle.']],
 condp:[['When to use it','What would have happened but did not: <i>Yo lo habría hecho</i> (I would have done it).'],
  ['With "si" clauses','Pairs with the past perfect subjunctive for regrets about the past: <i>Si hubiera estudiado, habría aprobado</i> (If I had studied, I would have passed).'],
  ['How it is built','Conditional of <b>haber</b> (habría, habrías…) + past participle.']],
 subj:[['When to use it','After a main clause with <i>que</i> that expresses wishing, emotion, doubt, need or influence over someone else – remember <b>WEIRDO</b>: Wishes, Emotions, Impersonal expressions, Recommendations, Doubt, Ojalá. <i>Quiero que vengas</i>, <i>Me alegra que estés aquí</i>, <i>Es necesario que estudies</i>.'],
  ['Subjunctive vs. indicative','Indicative states facts or beliefs; subjunctive is for things that are wanted, felt or uncertain. <i>Creo que viene</i> (I think he is coming) vs. <i>No creo que venga</i> (I don\'t think he is coming).'],

  ['With future time','After <i>cuando, en cuanto, hasta que</i> about the future: <i>Cuando llegues, llámame</i>.'],
  ['How it is built','Take the yo form of the present, drop the -o and switch the vowel: -ar verbs take -e endings, -er/-ir verbs take -a endings. <i>hablo → hable</i>, <i>tengo → tenga</i>.']],
 isubj:[['When to use it','The same triggers as the present subjunctive, but when the main verb is in the past or conditional: <i>Quería que vinieras</i>. Also for unreal or unlikely "if" situations: <i>Si fuera rico…</i>'],
  ['-ra or -se?','Two equal forms: <i>hablara</i> and <i>hablase</i>. The -ra form is more common, especially in Latin America. This app uses -ra.'],

  ['How it is built','Imperfect subjunctive of <b>haber</b> (hubiera, hubieras…) + past participle.']],

  ['Tú vs. usted','The regular tú command looks like the él form of the present: <i>habla, come</i>. Usted, ustedes and nosotros commands use the present subjunctive: <i>hable, coman, hablemos</i> (let\'s talk).'],
  ['Pronouns','Object and reflexive pronouns stick to the end, often adding an accent: <i>dime, siéntate, dámelo</i>.'],

  ['Where they go','Before a conjugated verb: <i>me levanto</i>. Attached to an infinitive, gerund or positive command: <i>voy a levantarme, estoy duchándome, ¡levántate!</i> With an infinitive or gerund you may also put it first: <i>me voy a levantar</i>. Negative commands put it first: <i>¡no te levantes!</i>'],

  ['What they do','Doing it to yourself (<i>me lavo</i>), each other (<i>nos queremos</i>), getting or becoming (<i>enfadarse, cansarse, casarse, ponerse nervioso</i>), and daily routine (<i>despertarse, ducharse, vestirse, acostarse</i>).'],
  ['Body parts and clothes','Use the article, not the possessive: <i>me lavo <b>las</b> manos</i>, <i>se puso <b>la</b> chaqueta</i>.'],
  ['Accidents','<i>se</i> + the person it happened to: <i>se me olvidó</i> (I forgot), <i>se me cayó</i> (I dropped it), <i>se te rompió</i> (you broke it, by accident).'],
  ['Impersonal se','<i>se habla español</i> (Spanish is spoken), <i>se venden pisos</i> (flats for sale), <i>¿cómo se dice...?</i> (how do you say...?)'],
  ['Doing it completely','<i>comerse, beberse, leerse</i>: <i>me comí toda la pizza</i> (I ate the whole pizza).'],
  ['Meaning changes with se','<i>ir</i> go / <i>irse</i> leave · <i>dormir</i> sleep / <i>dormirse</i> fall asleep · <i>quedar</i> meet up / <i>quedarse</i> stay · <i>llamar</i> call / <i>llamarse</i> be called · <i>parecer</i> seem / <i>parecerse a</i> look like · <i>poner</i> put / <i>ponerse</i> put on, become · <i>despedir</i> fire / <i>despedirse</i> say goodbye · <i>acordar</i> agree / <i>acordarse de</i> remember · <i>negar</i> deny / <i>negarse a</i> refuse · <i>fijar</i> fix / <i>fijarse en</i> notice'],
  ['Always reflexive','<i>quejarse</i> (complain), <i>arrepentirse</i> (regret), <i>atreverse</i> (dare), <i>darse cuenta</i> (realise), <i>jactarse</i> (brag)'],
  ['Watch out','The pronoun matches the subject, even on an infinitive: <i>quiero acostar<b>me</b></i>, not <i>acostarse</i>. <i>Me llamo</i> is just "my name is", not "I call myself".']]],
 ['Possessives','mi, tu, su... and mío, tuyo, suyo',[
  ['Short form: before the noun','<table><tr><td></td><td><b>one thing</b></td><td><b>more than one</b></td></tr><tr><td>yo</td><td>mi</td><td>mis</td></tr><tr><td>tú</td><td>tu</td><td>tus</td></tr><tr><td>él / ella / usted</td><td>su</td><td>sus</td></tr><tr><td>nosotros</td><td>nuestro / nuestra</td><td>nuestros / nuestras</td></tr><tr><td>vosotros</td><td>vuestro / vuestra</td><td>vuestros / vuestras</td></tr><tr><td>ellos / ustedes</td><td>su</td><td>sus</td></tr></table>'],
  ['Long (stressed) form: after the noun or alone','<table><tr><td></td><td><b>one thing</b></td><td><b>more than one</b></td></tr><tr><td>yo</td><td>mío / mía</td><td>míos / mías</td></tr><tr><td>tú</td><td>tuyo / tuya</td><td>tuyos / tuyas</td></tr><tr><td>él / ella / usted</td><td>suyo / suya</td><td>suyos / suyas</td></tr><tr><td>nosotros</td><td>nuestro / nuestra</td><td>nuestros / nuestras</td></tr><tr><td>vosotros</td><td>vuestro / vuestra</td><td>vuestros / vuestras</td></tr><tr><td>ellos / ustedes</td><td>suyo / suya</td><td>suyos / suyas</td></tr></table>'],
  ['They agree with the thing, not the owner','<i>nuestra casa</i> (casa is feminine), <i>mis libros</i> (books are plural), even if the owner is one man. Only <i>nuestro</i>, <i>vuestro</i> and the long forms change for masculine and feminine.'],
  ['Where the long form goes','After the noun: <i>un amigo mío</i> (a friend of mine). After <i>ser</i>: <i>es mío</i> (it\'s mine). With an article, to stand for the noun: <i>mi casa y la tuya</i> (my house and yours).'],
  ['Su can mean a lot','<i>su casa</i> can be his, her, your (usted) or their house. If it is unclear, say <i>la casa de él / de ella / de usted / de ellos</i>.'],
  ['Watch out','<i>tu</i> (your) has no accent; <i>tú</i> (you) does. Body parts use the article, not the possessive: <i>me duele la cabeza</i>, not <i>mi cabeza</i>. Set phrases: <i>¡Dios mío!</i>, <i>muy señor mío</i>.']]],
 ['yo, me, mí, mi','Four words for "I", "me" and "my"',[
  ['Which one when','<table><tr><td><b>yo</b></td><td>I, the subject: <i>yo hablo</i> (often left out: <i>hablo</i>)</td></tr><tr><td><b>me</b></td><td>me, before the verb: <i>me ve</i> (he sees me), <i>me da el libro</i> (he gives me the book), <i>me llamo</i></td></tr><tr><td><b>mí</b></td><td>me, after a preposition: <i>para mí, de mí, a mí</i></td></tr><tr><td><b>mi</b></td><td>my, before a noun: <i>mi casa, mis libros</i></td></tr></table>'],
  ['The same pattern for every person','<table><tr><td></td><td><b>object</b></td><td><b>after a preposition</b></td><td><b>my, your...</b></td></tr><tr><td>yo</td><td>me</td><td>mí</td><td>mi</td></tr><tr><td>tú</td><td>te</td><td>ti</td><td>tu</td></tr><tr><td>él / ella / usted</td><td>lo, la, le, se</td><td>él, ella, usted</td><td>su</td></tr><tr><td>nosotros</td><td>nos</td><td>nosotros</td><td>nuestro</td></tr><tr><td>vosotros</td><td>os</td><td>vosotros</td><td>vuestro</td></tr><tr><td>ellos / ustedes</td><td>los, las, les, se</td><td>ellos, ustedes</td><td>su</td></tr></table>'],
  ['A mí me gusta','Both are right together: <i>me</i> is required, <i>a mí</i> adds emphasis ("I like it"). <i>A mí gusta</i> on its own is wrong.'],
  ['Con + mí = conmigo','<i>conmigo</i> (with me) and <i>contigo</i> (with you). Never <i>con mí</i> or <i>con ti</i>.'],
  ['Exceptions that take yo and tú','<i>entre tú y yo</i> (between you and me), <i>según tú</i>, <i>excepto yo</i>, <i>menos yo</i>, <i>incluso yo</i>.'],
  ['Watch out','<i>mí</i> (me) has an accent; <i>mi</i> (my) does not. <i>ti</i> never has one.']]],
 ['Personal a','veo a María, not veo María',[
  ['The rule','When the direct object is a specific person, put <i>a</i> in front: <i>veo a María, llamo a mi madre, conozco al profesor</i>. Things do not take it: <i>veo la casa</i>.'],
  ['Pets and places','Pets you care about usually get it: <i>paseo a mi perro</i>. Places do not: <i>visito Madrid</i>.'],
  ['Pronouns for people','<i>alguien, nadie, quien</i> take it: <i>¿Ves a alguien? No veo a nadie. ¿A quién buscas?</i>'],
  ['Not with tener','<i>Tengo dos hermanos</i>, not <i>a dos hermanos</i>. Also left out when the person is not specific: <i>busco un médico</i> (any doctor) vs. <i>busco a mi médico</i>.'],
  ['a + el = al','<i>a el</i> always joins up: <i>veo al chico</i>. Not with the pronoun <i>él</i>: <i>lo veo a él</i>.'],
  ['Watch out','English has nothing like it, so it is easy to drop. If you can answer "who?" rather than "what?", you probably need it.']]],
 ['False friends','Look English, mean something else',[
  ['Classic traps','<i>embarazada</i> pregnant (embarrassed = <i>avergonzado</i>) · <i>actualmente</i> currently (actually = <i>en realidad</i>) · <i>librería</i> bookshop (library = <i>biblioteca</i>) · <i>constipado</i> has a cold (constipated = <i>estreñido</i>) · <i>éxito</i> success (exit = <i>salida</i>)'],
  ['More','<i>carpeta</i> folder (carpet = <i>alfombra</i>) · <i>recordar</i> remember (record = <i>grabar</i>) · <i>realizar</i> carry out (realise = <i>darse cuenta</i>) · <i>asistir</i> attend (assist = <i>ayudar</i>) · <i>sensible</i> sensitive (sensible = <i>sensato</i>) · <i>introducir</i> insert (introduce a person = <i>presentar</i>)'],
  ['Even more','<i>ropa</i> clothes · <i>sopa</i> soup · <i>fábrica</i> factory (fabric = <i>tela</i>) · <i>decepción</i> disappointment · <i>compromiso</i> commitment · <i>molestar</i> bother · <i>excitado</i> aroused (excited = <i>emocionado</i>)']]],
 ['Small words, big fluency','ya, ni, según, aunque...',[
  ['Ya','Already (<i>ya comí</i>), now (<i>¡ya!</i>), or "I get it" (<i>ya, ya</i>). <i>Ya no</i> = no longer. <i>Ya voy</i> = coming!'],
  ['Todavía / aún','Still or yet: <i>todavía no</i> (not yet). Note <i>aún</i> (still) vs. <i>aun</i> (even).'],
  ['Ni','Neither / nor: <i>ni frío ni calor</i>. <i>Ni idea</i> = no idea. <i>Ni siquiera</i> = not even.'],
  ['Según','According to (<i>según el médico</i>), or on its own: "it depends" (<i>¿Vienes? – Según.</i>).'],
  ['Aunque','Although / even if. A fact takes the indicative (<i>aunque llueve, salgo</i>); a possibility takes the subjunctive (<i>aunque llueva, saldré</i>).'],
  ['Sino vs. pero','After a negative, "but rather" is <i>sino</i>: <i>no es rojo sino azul</i>.'],
  ['Hasta','Until, or even: <i>hasta mi abuela lo sabe</i>.'],
  ['Conversation glue','<i>pues</i> (well), <i>bueno</i> (OK, well), <i>o sea</i> (I mean), <i>es que</i> (the thing is), <i>a ver</i> (let\'s see), <i>vale</i> (OK, Spain), <i>igual</i> (maybe)'],
  ['Verb + infinitive helpers','<i>acabar de</i> (have just: <i>acabo de llegar</i>) · <i>volver a</i> (again: <i>vuelve a llamar</i>) · <i>soler</i> (usually: <i>suelo correr</i>)']]],
 ['Mixed-up verb pairs','saber/conocer, pedir/preguntar...',[
  ['SABER vs. CONOCER','<i>saber</i>: facts and skills (<i>sé nadar</i>). <i>conocer</i>: people, places, being familiar (<i>conozco Madrid</i>).'],
  ['PEDIR vs. PREGUNTAR','<i>pedir</i>: ask for something (<i>pido un café</i>). <i>preguntar</i>: ask a question (<i>pregunto la hora</i>).'],
  ['LLEVAR vs. TRAER','<i>llevar</i>: take there. <i>traer</i>: bring here.'],
  ['TENER QUE / HAY QUE / DEBER','<i>tengo que</i>: I have to. <i>hay que</i>: one has to (general). <i>debo</i>: I should (moral). <i>debe de estar</i>: he must be (a guess).'],
  ['GUSTAR-style verbs','The thing liked is the subject: <i>me gusta el libro, me gustan los libros</i>. Same pattern: <i>encantar, doler, faltar, importar, interesar</i>.']]],
 ['Preterite vs. imperfect','Two past tenses',[
  ['Preterite','A finished event, a specific moment, or a sequence: <i>ayer comí paella, de repente sonó el teléfono</i>.'],
  ['Imperfect','Background, habits and descriptions: <i>cuando era niño, siempre jugaba fuera; hacía sol</i>.'],
  ['Together','The imperfect sets the scene, the preterite interrupts it: <i>Leía cuando llamaste.</i>'],
  ['Trigger words','Preterite: <i>ayer, anoche, el lunes, de repente, una vez</i>. Imperfect: <i>siempre, a menudo, mientras, todos los días, de niño</i>.']]],
 ['When to use the subjunctive','WEIRDO',[
  ['The triggers','<b>W</b>ishes (<i>quiero que vengas</i>), <b>E</b>motions (<i>me alegra que estés aquí</i>), <b>I</b>mpersonal phrases (<i>es importante que estudies</i>), <b>R</b>ecommendations (<i>te sugiero que descanses</i>), <b>D</b>oubt (<i>dudo que sea verdad</i>), <b>O</b>jalá (<i>ojalá llueva</i>).'],
  ['Two subjects','The subjunctive usually needs a change of subject. Same subject: infinitive. <i>Quiero ir</i> vs. <i>quiero que vayas</i>.'],
  ['Cuando + future','A future action after <i>cuando</i> takes the subjunctive: <i>cuando llegues, llámame</i>.']]],
 ['Grammar traps','Small rules that catch everyone',[
  ['Double negatives are correct','<i>No tengo nada. No vino nadie.</i>'],
  ['Adjective position','<i>un gran hombre</i> (a great man) / <i>un hombre grande</i> (a big man) · <i>un viejo amigo</i> (long-time) / <i>un amigo viejo</i> (elderly) · <i>pobre chico</i> (unlucky) / <i>chico pobre</i> (poor)'],
  ['Gender exceptions','<i>el día, el mapa, el problema, el idioma</i> · <i>la mano, la foto, la moto</i> · <i>el agua</i> (feminine, but <i>el</i> before a stressed a-)'],
  ['Accents that change meaning','<i>tú</i> you / <i>tu</i> your · <i>él</i> he / <i>el</i> the · <i>sí</i> yes / <i>si</i> if · <i>sé</i> I know / <i>se</i> · <i>más</i> more / <i>mas</i> but · <i>qué, cómo, dónde</i> in questions']]],
 ['Pronunciation and spelling','Sounds and letters',[
  ['B and V','Sound the same.'],
  ['H','Always silent: <i>hola, hay</i>.'],
  ['LL and Y','Sound the same in most places.'],
  ['C and Z','"th" in most of Spain, "s" in Latin America: <i>gracias, zapato</i>.'],
  ['Stress','Words ending in a vowel, n or s stress the second-to-last syllable; others stress the last. Anything else needs a written accent: <i>café, árbol, teléfono</i>.'],
  ['Spelling changes in verbs','To keep the sound: <i>buscar → busqué, llegar → llegué, empezar → empecé, coger → cojo</i>.']]],
 ['Spain vs. Latin America','Same language, different habits',[
  ['You (plural)','Spain: <i>vosotros</i> (friends) and <i>ustedes</i> (formal). Latin America: <i>ustedes</i> for both.'],
  ['Vos','Used for <i>tú</i> in Argentina, Uruguay and much of Central America: <i>vos tenés, vos sos</i>.'],
  ['Past tense','Spain uses <i>he comido</i> for things done today; Latin America mostly says <i>comí</i>.'],
  ['Words','computer: <i>ordenador / computadora</i> · car: <i>coche / carro, auto</i> · phone: <i>móvil / celular</i> · juice: <i>zumo / jugo</i>. <i>Coger</i> (to take) is rude in much of Latin America: use <i>tomar</i> or <i>agarrar</i>.']]]];

 verbs(){
  view.innerHTML=`<div class="stack"><h1 style="font-size:26px">Verb dictionary</h1>
   <input type="search" id="vq" placeholder="Search a verb, a meaning or a conjugated form" aria-label="Search verbs" value="${dictQuery}">
   <div class="dict-tools"><div class="seg" role="group" aria-label="Which verbs"><button id="fa" aria-pressed="${!S.favOnly}">All verbs</button><button id="fm" aria-pressed="${S.favOnly}">★ My verbs (${S.fav.length})</button></div>
   <button class="iconbtn ${activeFilters()?'on':''}" id="flt" aria-label="Filters">${ICON.filter}${activeFilters()||''}</button></div>
   <div id="vl"></div></div>`;
  const vq=document.getElementById('vq'),vl=document.getElementById('vl');
  document.getElementById('fa').onclick=()=>{S.favOnly=false;save();VIEWS.verbs()};
  document.getElementById('fm').onclick=()=>{S.favOnly=true;save();VIEWS.verbs()};
  document.getElementById('flt').onclick=filterSheet;
  const row=v=>`<div class="vrow"><button class="star" data-star="${v.inf}" aria-pressed="${S.fav.includes(v.inf)}" aria-label="Save ${v.inf} to my verbs">★</button>
    <button class="open" data-v="${v.inf}"><b>${v.inf}</b><span class="m">${v.en}</span></button>${primaryTag(v)}</div>`;
  const draw=()=>{
   dictQuery=vq.value;const s=strip(norm(vq.value)),list=filtered();let html='';
   if(s){
    if(!formIndex)buildIndex();
    const exact=[...(formIndex.get(s)||[])].filter(v=>list.includes(v));
    const named=list.filter(v=>!exact.includes(v)&&(strip(v.inf).includes(s)||v.en.toLowerCase().includes(s)))
      .sort((a,b)=>(strip(b.inf).startsWith(s)-strip(a.inf).startsWith(s))||a.rank-b.rank);
    if(exact.length)html+=`<div class="section-label">Exact conjugation matches</div>`+exact.map(row).join('');
    if(named.length)html+=`<div class="section-label">Verbs and meanings</div>`+named.map(row).join('');
    if(!html)html=`<p class="muted">No verb or conjugated form matches "${vq.value.replace(/</g,'&lt;')}". Try the infinitive, or clear filters.</p>`;
    vl.innerHTML=html;
   }else{
    const sorted=list.slice().sort((a,b)=>a.inf.localeCompare(b.inf,'es')),letters=[];
    for(const v of sorted){const l=strip(v.inf[0]).toUpperCase();if(letters.at(-1)!==l){letters.push(l);html+=`<div class="letter" id="L-${l}">${l}</div>`}html+=row(v)}
    vl.innerHTML=sorted.length?`<div class="small muted">${sorted.length} verbs</div><div class="dict"><div>${html}</div><nav class="rail" aria-label="Jump to letter">${letters.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</nav></div>`
      :`<p class="muted">${S.favOnly?'No saved verbs yet. Tap the ★ next to a verb to save it here.':'No verbs match these filters.'}</p>`;
    vl.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>document.getElementById('L-'+b.dataset.l).scrollIntoView());
   }
   vl.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>verbSheet(verbBy(b.dataset.v)));
   vl.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{toggleFav(b.dataset.star);b.setAttribute('aria-pressed',S.fav.includes(b.dataset.star));document.getElementById('fm').textContent=`★ My verbs (${S.fav.length})`});
  };
  vq.oninput=draw;draw();
 },

   return `<div><div class="row small"><span>${tn(t.id)}</span><span class="muted">${p}% of ${s.n}</span></div><div class="meter"><i style="width:${p}%"></i></div></div>`}).join('')||'<p class="muted small" style="margin:0">Finish a level or a quiz to see your accuracy here.</p>'}
   <p class="muted small" style="margin:0">${stars} of ${LEVELS.length*3} level stars earned.</p></div>
  </div>`;

  if(weak)document.getElementById('weak').onclick=()=>drillCell(weak.t,weak.p);

    quiz(build(['pres','pret','impf','fut','subj'],vs,10),{title:`Top ${n} verbs`})});
 }

function heatHtml(){ // rows: the level-path tenses plus the imperative; columns: persons
  const ts=[...TENSES.map(t=>t.id),'imp'],ps=persons(),cl=v=>v==null?'h0':v>=90?'h4':v>=80?'h3':v>=65?'h2':'h1',short=['yo','tú','él','nos.','vos.','ellos'];
  return `<div class="heat" style="grid-template-columns:96px repeat(${ps.length},minmax(0,1fr))"><span></span>${ps.map(p=>`<span class="muted" style="font-size:11px;text-align:center">${short[p]}</span>`).join('')}`+
   ts.map(t=>`<span style="font-size:12px;font-weight:700;align-self:center">${tn(t)}</span>`+ps.map(p=>{if(t==='imp'&&p===0)return '<span class="cell h0">–</span>';
     const s=S.stp[t+'|'+p],v=s?Math.round(s.c/s.n*100):null;
     return `<button class="cell ${cl(v)}" data-cell="${t}|${p}" aria-label="${tn(t)}, ${LAB[p]}: ${v==null?'not practised yet':v+'%'}">${v==null?'·':v}</button>`}).join('')).join('')+'</div>';
}

function filterSheet(){
  const f=structuredClone(S.vf);
  const draw=()=>{

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;

    const c=cur.kind==='conj',gloss=c?english(cur.v,cur.t,cur.p):'';
    $('pr').innerHTML=cur.kind==='tip'?`<span class="tchip">${tt(cur.tip)}</span><div class="inf" style="font-size:26px;line-height:1.3">${cur.s.replace('___','<span style="color:var(--blue)">___</span>')}</div><div class="en">${cur.en}</div>${cur.opts.includes('—')?'<div class="muted small">— means nothing goes in the gap</div>':''}`
      :cur.kind==='sent'?`<span class="tchip">${tn(cur.t)}</span><div class="inf" style="font-size:26px;line-height:1.3">${cur.s.replace('___',`<span style="color:var(--blue)">___</span> <span class="muted" style="font-weight:600">(${cur.v.inf})</span>`)}</div><div class="en">${cur.en}</div>`
      :c?`<span class="tchip">${tn(cur.t)}</span>${opt.hideInf?'':`<div class="inf">${cur.v.inf}</div>`}${opt.hideEn?'':`<div class="en">${gloss}</div>`}<div class="who">${SUBJ.has(cur.t)?'que ':''}${cur.who} …</div>`
      :`<span class="tchip">Meaning</span><div class="inf" style="font-size:30px">${cur.v.en}</div>${cur.v.refl?'<div class="en">reflexive</div>':''}`;
    if(mode==='type'){
      io.innerHTML=`<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="${cur.kind==='mean'?'Type the Spanish verb':'Type the form'}">
        <div class="accents">${['á','é','í','ó','ú','ñ','ü'].map(ch=>`<button data-c="${ch}" aria-label="Insert ${ch}">${ch}</button>`).join('')}</div><div class="small" id="hint"></div>`;
      const ans=$('ans');
      io.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const s=ans.selectionStart??ans.value.length,e=ans.selectionEnd??s;ans.value=ans.value.slice(0,s)+b.dataset.c+ans.value.slice(e);ans.focus();ans.setSelectionRange(s+1,s+1)});
      ans.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();phase==='ask'?submit(norm(ans.value),true):next2()}};
      ans.oninput=()=>{$('hint').textContent='';if(S.auto&&norm(ans.value)===cur.ans)submit(cur.ans,true)};
      ctl.innerHTML=`<button class="btn" id="ck">Check</button>`;$('ck').onclick=()=>phase==='ask'?submit(norm(ans.value),true):next2();ans.focus();
    }else if(mode==='mc'){
      io.innerHTML=choices(cur).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('');ctl.innerHTML='';
      io.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(phase!=='ask')return;submit(b.dataset.o,false);
        io.querySelectorAll('[data-o]').forEach(o=>{o.classList.toggle('right',o.dataset.o===cur.ans);o.classList.toggle('wrong',o===b&&o.dataset.o!==cur.ans)})});
    }else{
      io.innerHTML=`<div class="card prompt muted">Say or think the answer, then reveal it.</div>`;
      ctl.innerHTML=`<button class="btn" id="rv">Reveal answer</button>`;
      $('rv').onclick=()=>{io.innerHTML=`<div class="card prompt"><div class="inf" style="color:var(--blue)">${cur.ans}</div><button class="speak" id="sa">${ICON.speak.replace('<svg','<svg width="22" height="22"')} Hear it</button></div>`;
        $('sa').onclick=()=>speak(cur.ans,true);speak(cur.ans);
        ctl.innerHTML=`<div class="row"><button class="btn ghost" id="no">I was wrong</button><button class="btn" id="yes">I was right</button></div>`;
        $('no').onclick=()=>{record(false,'');next2()};$('yes').onclick=()=>{record(true);next2()}};
    }
  }
  function record(ok,got){if(navigator.vibrate&&navigator.userActivation?.hasBeenActive!==false)try{navigator.vibrate(ok?15:[30,40,30])}catch{}recordAnswer(cur,ok);ok?okN++:badN++;if(!ok)mistakes.push({x:cur,got});save();i++;tally()}
  function next2(){next()}
  function submit(got,typed){
    if(!got)return;
    const exact=got===cur.ans,loose=strip(got)===strip(cur.ans);
    const syn=cur.kind==='mean'&&!loose&&VERBS.find(v=>(S.strict?v.inf===got:strip(v.inf)===strip(got))&&covers(v,cur.v));
    const ok=exact||(typed&&loose&&!S.strict)||!!syn;
    if(!ok&&typed&&S.typo&&!typoUsed&&lev(strip(got),strip(cur.ans))<=2&&got.length>2){typoUsed=true;$('hint').innerHTML='<span class="badc">🤔 There might be a typo. Check it, then press Check again.</span>';return}
    phase='fb';record(ok,got);if($('hint'))$('hint').textContent='';
    const ans=$('ans');if(ans){ans.disabled=true;ans.className='answer '+(ok?'ok':'bad')}
    const c=cur.kind==='conj',say=(c&&SUBJ.has(cur.t)?'que ':'')+(c?cur.who+' ':'')+cur.ans;
    if(ok){
      speak(say);
      if(exact&&S.pause!=='always'){fb.innerHTML=`<div class="fb ok">¡Correcto!</div>`;phase='wait';setTimeout(()=>{if(phase==='wait')next()},mode==='mc'?900:650);return}
      fb.innerHTML=syn?`<div class="fb ok">¡Correcto! ${syn.inf} works too. This one was looking for: <span class="c">${cur.ans}</span></div>`:`<div class="fb ok">${exact?'¡Correcto!':'Correct, but mind the accent:'} <span class="c">${exact?'':cur.ans}</span></div>`;
    }else{
      // near miss = within 2 letters and not some other real form (those get a specific diagnosis instead)
      const d0=diagnose(cur,got),near=got.length>2&&lev(strip(got),strip(cur.ans))<=2&&!(d0&&/^(Right|Wrong|Regular)/.test(d0[0])),d=near&&d0&&d0[0]==='Not a real verb.'?null:d0;
      fb.innerHTML=`<div class="fb bad"><div>${near?'So close! Just a spelling slip – check the highlighted letters.':"That's incorrect…"}</div>
        <div class="cmp"><div>✓ <span class="c">${hl(cur.ans,got)}</span> <button class="speak" id="sa" aria-label="Hear it">${ICON.speak.replace('<svg','<svg width="20" height="20"')}</button></div>
        <div>✗ <span class="c wrongc">${hl(got,cur.ans)}</span></div>${c?`<div class="muted small"><i>${english(cur.v,cur.t,cur.p)}</i></div>`:''}</div>
        ${d?`<p class="diag"><b>${d[0]}</b> ${d[1]}</p>`:''}${c&&d&&/tense/.test(d[0])?`<p class="small muted" style="margin:0">${T[cur.t].use}</p>`:''}</div>`;
      $('sa').onclick=()=>speak(say,true);
    }
    ctl.innerHTML=`<div class="row">${c?'<button class="btn ghost" id="stp">Steps</button>':''}<button class="btn" id="nx">${i>=total?'See results':'Next question'}</button></div>`;
    if(c){const x=cur;$('stp').onclick=()=>showSteps(x.v,x.t,x.p)}
    $('nx').onclick=next;$('nx').focus();
  }
  function finish(){
    const pct=Math.round(okN/total*100),stars=pct>=100?3:pct>=80?2:pct>=60?1:0;
    S.xp+=okN*10;bumpStreak();S.quizzes++;S.scoreSum+=pct;S.days[today()]=(S.days[today()]||0)+1;
    if(opt.level&&stars>(S.lv[opt.level.id]||0))S.lv[opt.level.id]=stars;
    save();header();
    const nextLvl=opt.level&&stars?LEVELS[LEVELS.indexOf(opt.level)+1]:null;
    const msg=opt.pass?(okN>=opt.pass?'Passed. You’re ready for the next level.':`Not yet. You need ${opt.pass} of ${total} to pass. Practise a few sets and try again.`):pct===100?'You made that look easy!':pct>=80?'So close! Keep practising to get 100%.':pct>=60?'Good effort. Review the mistakes below.':'Keep going. Each mistake is now in your Smart review.';
    body.innerHTML=`<div class="prompt stack" style="align-items:center"><div class="big" style="font-size:64px">${pct}%</div>
      <p class="muted" style="margin:0">${opt.title} – ${okN} of ${total} correct</p><p style="margin:0;font-size:18px">${msg}</p>
      ${opt.level?starHtml(stars):''}<span class="pill gold">🔥 ${S.streak} day streak</span>
      ${opt.level&&!stars?'<p class="muted small" style="margin:0">Score 60% or more to unlock the next level.</p>':''}</div>
      ${mistakes.length?`<section class="stack"><h2 style="font-size:20px">Your mistakes</h2>${mistakes.map((m,k)=>`<div class="card mist"><div class="row"><span class="muted small">${m.x.kind==='conj'?`${m.x.who} (${m.x.v.inf.toUpperCase()}) · ${tn(m.x.t)}`:m.x.kind==='sent'?`${m.x.s} (${m.x.v.inf})`:m.x.kind==='tip'?m.x.s:m.x.v.en}</span>${m.x.kind==='conj'?`<button class="speak" data-ms="${k}" aria-label="Steps">${ICON.steps.replace('<svg','<svg width="20" height="20"')}</button>`:''}</div>
        <div>✓ <b>${hl(m.x.ans,m.got)}</b> ${m.got?`&nbsp; ✗ <span class="wrongc">${hl(m.got,m.x.ans)}</span>`:''}</div></div>`).join('')}
        <p class="muted small" style="margin:0">${mistakes.filter(m=>m.x.kind==='conj').length?'These forms are in your Smart review and come back until you get them right twice.':''}</p></section>`:''}
      ${covered.length?`<section><div class="row"><h2 style="font-size:20px">Verbs covered</h2><span class="muted small">Star to add to My verbs</span></div>
      <div>${covered.map(v=>`<div class="vrow"><button class="star" data-star="${v.inf}" aria-pressed="${S.fav.includes(v.inf)}" aria-label="Save ${v.inf}">★</button><button class="open" data-v="${v.inf}"><b>${v.inf}</b><span class="m">${v.en}</span></button></div>`).join('')}</div></section>`:''}
      <div class="spacer"></div>
      ${nextLvl?'<button class="btn" id="nx">Next level</button>':''}
      ${mistakes.length?`<button class="btn ${nextLvl?'ghost':''}" id="rq">Quiz my mistakes</button>`:''}
      <button class="btn ghost" id="again">${opt.level&&!stars?'Try again':'Done'}</button>`;
    body.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>{const m=mistakes[+b.dataset.ms].x;showSteps(m.v,m.t,m.p)});
    body.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{toggleFav(b.dataset.star);b.setAttribute('aria-pressed',S.fav.includes(b.dataset.star))});
    body.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>verbSheet(verbBy(b.dataset.v)));
    document.getElementById('again').onclick=()=>opt.level&&!stars?intro(opt.level):exit();
    if(nextLvl)document.getElementById('nx').onclick=()=>intro(nextLvl);
    const rq=document.getElementById('rq');if(rq)rq.onclick=()=>quiz(shuffle(mistakes.map(m=>({...m.x}))),{...opt,level:null,title:'Mistakes'});
  }
  next();
}

show('learn');

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

</script>
