html,body{height:100%}

.right{padding:20px 24px 28px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px}

.pop{display:inline-block;animation:pop 260ms cubic-bezier(.2,.9,.3,1.4)}

.cell{height:34px;border:0;border-radius:8px;font:700 13px var(--text);padding:0;color:var(--ink)}

  {t:'Imperativo', v:'hacer', a:'hagas', s:'No ___ ruido, que el bebé está durmiendo.', en:'Don’t make any noise, the baby’s sleeping.', note:'Negative tú commands use the subjuntivo: no hagas.'}
];
const KIND = {set:{bank:BANK, n:5}, sent:{bank:SENT, n:5}, test:{bank:SENT, n:10, pass:8}};

const S = {screen:'levels', qs:[], i:0, answer:'', status:'typing', res:[], last:null, mood:0, tl:'es', kind:'set', verb:null, vq:''};
try { if (localStorage.getItem('conjuga-tl') === 'en') S.tl = 'en'; } catch(e){}
const EN = {'Presente':'Present','Pretérito':'Preterite','Imperfecto':'Imperfect','Futuro':'Future','Condicional':'Conditional','Subj. pres.':'Pres. subj.','Imperativo':'Imperative','Indicativo':'Indicative','Subjuntivo':'Subjunctive','Afirmativo':'Affirmative','Negativo':'Negative','Perfecto':'Present perfect'};
const tn = k => S.tl === 'en' ? EN[k] : k;
const T = k => `<span lang="${S.tl}">${tn(k)}</span>`;
S.theme = 'system';
try { S.theme = localStorage.getItem('conjuga-theme') || 'system'; } catch(e){}
const applyTheme = () => { const r = document.documentElement; if (S.theme === 'system') delete r.dataset.theme; else r.dataset.theme = S.theme; };
applyTheme();
const themeHtml = () => `<div class="tl" role="group" aria-label="Theme">${[['system','System'],['light','Light'],['dark','Dark']].map(([v, l]) => `<button data-theme-set="${v}" aria-pressed="${S.theme===v}">${l}</button>`).join('')}</div>`;
const tlHtml = () => `<div class="tl" role="group" aria-label="Tense names">${[['es','Español'],['en','English']].map(([v, l]) => `<button data-tl="${v}" aria-pressed="${S.tl===v}" lang="${v}">${l}</button>`).join('')}</div>`;
let timer;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

function diff(you, ok){
  let p = 0; while (p < you.length && p < ok.length && you[p] === ok[p]) p++;
  let s = 0; while (s < you.length - p && s < ok.length - p && you[you.length-1-s] === ok[ok.length-1-s]) s++;
  const cut = (w, cls) => esc(w.slice(0,p)) + `<span class="${cls}">${esc(w.slice(p, w.length - s))}</span>` + esc(w.slice(w.length - s));
  return {you: cut(you,'bad'), ok: cut(ok,'irr')};
}

function go(screen){ clearTimeout(timer); if (screen === 'verb') S.verb = null; S.screen = screen; render(); }
function start(kind = 'set'){
  clearTimeout(timer);
  const k = KIND[kind] || KIND.set;
  S.qs = k.bank.slice().sort(() => Math.random() - .5).slice(0, k.n);
  Object.assign(S, {screen:'drill', i:0, answer:'', status:'typing', res:[], kind: KIND[kind] ? kind : 'set'});
  render();
}
function check(){
  const q = S.qs[S.i], typed = S.answer.trim().toLowerCase();
  if (!typed) { const inp = app.querySelector('#ans'); inp && (inp.classList.remove('shake'), void inp.offsetWidth, inp.classList.add('shake')); return; }
  S.status = typed === q.a ? 'right' : strip(typed) === strip(q.a) ? 'close' : 'wrong';
  S.res.push({ok: S.status !== 'wrong', typed, q});
  if (navigator.vibrate && navigator.userActivation?.hasBeenActive !== false) try { navigator.vibrate(S.status === 'wrong' ? [30,40,30] : 15); } catch(e){}
  render();
  if (S.status === 'right') timer = setTimeout(next, 900);
}
function next(){
  clearTimeout(timer);
  if (S.i + 1 >= S.qs.length){ S.last = S.res.filter(r => r.ok).length + ' / ' + S.qs.length; S.screen = 'results'; }
  else { S.i++; S.answer = ''; S.status = 'typing'; }
  render();
}

let formIndex = null;
function verbListHtml(){
  const s = strip(S.vq.trim().toLowerCase());
  const row = v => `<button class="vrow" data-verb="${esc(v.inf)}"><b class="d" lang="es">${esc(v.inf)}</b><span class="muted">${esc(v.en)}</span>${v.irregular ? '<span class="tag irr">Irregular</span>' : v.stem ? '<span class="tag">Stem</span>' : ''}</button>`;
  if (!s) {
    let html = '', last = '';
    for (const v of VERBS.slice().sort((a, b) => a.inf.localeCompare(b.inf, 'es'))) {
      const l = strip(v.inf[0]).toUpperCase();
      if (l !== last) { last = l; html += `<h2 class="d letter">${l}</h2>`; }
      html += row(v);
    }
    return `<p class="muted" style="font-size:13px;margin-top:10px">${VERBS.length} verbs</p>` + html;
  }
  if (!formIndex) { // every conjugated form, so "fui" finds ir and ser
    formIndex = new Map();
    const add = (f, v) => { const k = strip(f.split(' ').pop()); formIndex.has(k) || formIndex.set(k, new Set()); formIndex.get(k).add(v); };
    for (const v of VERBS) { for (const t of ['pres','pret','impf','fut','cond','subj','isubj','imp']) for (const f of conj(v, t)) f && add(f, v); add(gerund(v), v); add(participle(v), v); }
  }
  const exact = [...(formIndex.get(s) || [])];
  const named = VERBS.filter(v => !exact.includes(v) && (strip(v.inf).includes(s) || v.en.toLowerCase().includes(s)))
    .sort((a, b) => (strip(b.inf).startsWith(s) - strip(a.inf).startsWith(s)) || a.rank - b.rank);
  return (exact.length ? `<h2 class="letter" style="font-size:13px">Exact form matches</h2>${exact.map(row).join('')}` : '')
    + (named.length ? `<h2 class="letter" style="font-size:13px">Verbs and meanings</h2>${named.map(row).join('')}` : '')
    || `<p class="muted" style="margin-top:16px">Nothing matches “${esc(S.vq)}”. Try the infinitive.</p>`;
}

function navHtml(cur){
  const b = (id, label, icon) => `<button data-go="${id}" ${cur===id?'aria-current="page"':''}><span class="pill">${ICON[icon]}</span>${label}</button>`;
  return `<nav aria-label="Main">${b('levels','Levels','levels')}${b('today','Practice','practice')}${b('verb','Verbs','verbs')}${b('progress','Progress','prog')}</nav>`;
}

const PATH = [['Presente','hablo · I speak'],['Pretérito','hablé · I spoke'],['Imperfecto','hablaba · I used to speak'],['Futuro','hablaré · I will speak'],

    return `<div class="scroll"><div class="top"><h1 class="d">Progress</h1><p class="muted" style="margin-top:4px;font-size:13px">Example data</p></div>
      <section class="card" style="margin:16px 12px 0;padding:16px 12px 14px">
        <h2 style="font-size:16px;margin:0 4px">Accuracy by tense and person</h2>
        <p class="muted" style="margin:2px 4px 12px;font-size:13px">Tap a cell to practise it.</p>
        <div class="heat" lang="es">${grid}</div></section>
      <button data-act="start" style="margin:12px 12px 0;width:calc(100% - 24px);border:0;padding:0 8px 0 18px;min-height:60px;border-radius:20px;background:var(--irr-soft);display:flex;align-items:center;gap:10px;color:var(--ink);text-align:left">
        <span style="flex:1;font-size:14px">Weakest: <b><span lang="es">vosotros</span>, ${T('Pretérito').toLowerCase()}</b> · 41%</span>
        <span class="pri" style="height:44px;display:flex;align-items:center;padding:0 16px;font-size:14px">Practise</span></button>
      <section style="margin:20px 20px 0;display:flex;flex-direction:column;gap:12px"><h2 style="font-size:16px">Verbs mastered</h2>${mastery}</section>
      </div>${navHtml('progress')}`;
  }
};

function render(){
  app.innerHTML = VIEWS[S.screen]();
  const inp = app.querySelector('#ans');
  if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); inp.addEventListener('input', e => S.answer = e.target.value); }
  const nb = app.querySelector('#nextbtn'); if (nb) nb.focus();
  const vq = app.querySelector('#vq');
  if (vq) vq.addEventListener('input', e => { S.vq = e.target.value; app.querySelector('#vl').innerHTML = verbListHtml(); });
}

app.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.themeSet) { S.theme = t.dataset.themeSet; try { localStorage.setItem('conjuga-theme', S.theme); } catch(e){} applyTheme(); return render(); }
  if (t.dataset.tl) { S.tl = t.dataset.tl; try { localStorage.setItem('conjuga-tl', S.tl); } catch(e){} return render(); }
  if (t.dataset.verb !== undefined) { S.verb = t.dataset.verb || null; S.mood = 0; S.screen = 'verb'; render(); app.querySelector('.scroll').scrollTop = 0; return; }
  if (t.dataset.mood) { S.mood = +t.dataset.mood; return render(); }
  if (t.dataset.acc) { S.answer += t.dataset.acc; return render(); }
  if (t.dataset.act === 'start') return start(t.dataset.kind);
  if (t.dataset.act === 'next') return next();
});
app.addEventListener('submit', e => { e.preventDefault(); check(); });
render();
</script>
